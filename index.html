
<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First Website</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6fa;
      color: #222;
      line-height: 1.6;
    }

    header {
      background: #172554;
      color: white;
      padding: 20px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 18px;
    }

    .hero {
      padding: 100px 20px;
      text-align: center;
      background: #dbeafe;
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .button {
      display: inline-block;
      background: #2563eb;
      color: white;
      padding: 12px 25px;
      text-decoration: none;
      border-radius: 8px;
      margin-top: 15px;
    }

    .content {
      max-width: 900px;
      margin: 40px auto;
      padding: 30px;
      background: white;
      border-radius: 12px;
    }

    footer {
      text-align: center;
      background: #172554;
      color: white;
      padding: 20px;
    }

    @media (max-width: 600px) {
      header {
        flex-direction: column;
        gap: 10px;
      }

      .hero h1 {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h2>My Website</h2>

    <nav>
      <a href="#home">Home</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main>
    <section class="hero" id="home">
      <h1>မင်္ဂလာပါ။</h1>
      <p>ဒါက ကျွန်တော့်ရဲ့ ပထမဆုံး Website ဖြစ်ပါတယ်။</p>
      <a href="#contact" class="button">Contact Me</a>
    </section>

    <section class="content" id="about">
      <h2>About Me</h2>
      <p>
        ဒီ Website မှာ ကျွန်တော့်အကြောင်း၊
        လုပ်ငန်းအကြောင်းနဲ့ ဝန်ဆောင်မှုတွေကို
        ဖော်ပြထားပါတယ်။
      </p>
    </section>

    <section class="content" id="contact">
      <h2>Contact</h2>
      <p>Email: hello@example.com</p>
    </section>
  </main>

  <footer>
    <p>© 2026 My Website. All Rights Reserved.</p>
  </footer>

</body>
</html>
